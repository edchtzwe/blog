baseURL = 'https://edchtzwe.github.io/blog/'
languageCode = 'en-us'
title = 'Edmund Chong'
theme = 'LoveIt'

enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10
  path = "page"

[params]
  defaultTheme = "auto"
  dateFormat = "2006-01-02"
  description = "Thoughts on engineering, leadership, and building things that matter."

  [params.author]
    name = "Edmund Chong"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "Edmund Chong"
      typeit = false

  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2026

  [params.app]
    title = "Edmund Chong"
    themeColor = "#161209"

  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = "Search posts..."
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      threshold = 0.3
      location = 0
      distance = 100

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = ""
      title = "Hi, I'm Edmund 👋"
      subtitle = "Senior Software Engineer. I write about software architecture, team dynamics, and the craft of building things."
      typeit = true
      social = true
    [params.home.posts]
      enable = true
      paginate = 6

  [params.social]
    GitHub = "edchtzwe"
    Email = ""

  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    linkToMarkdown = true
    rssFullText = false
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true
      maxShownLines = 50
    [params.page.share]
      enable = true
      X = true
      Threads = true
      Facebook = true
      Linkedin = true
      HackerNews = true
      Telegram = true
    [params.page.comment]
      enable = false

[markup]
  [markup.highlight]
    codeFences = true
    lineNos = false
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[privacy]
  [privacy.googleAnalytics]
    disable = false
  [privacy.twitter]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

[languages]
  [languages.en]
    weight = 1
    languageCode = "en"
    languageName = "English"
    copyright = ""
    [languages.en.menu]
      [[languages.en.menu.main]]
        weight = 1
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
      [[languages.en.menu.main]]
        weight = 2
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
      [[languages.en.menu.main]]
        weight = 3
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
